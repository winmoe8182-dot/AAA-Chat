}

}

}
/* Final AAA Chat Login Size */

#login {
  width: 82% !important;
  max-width: 600px !important;
  transform: scale(1.2);
  transform-origin: center center;
  gap: 24px !important;
}

}

  min-height: 72px !important;
  font-size: 20px !important;
}

  min-height: 68px !important;

}

  min-height: 70px !important;

}

  width: 72px !important;
  min-height: 72px !important;
}

  font-size: 18px !important;
}
/* Phone Login spacing */
#phoneLogin > * + * {
  margin-top: 14px !important;
}

#otpSection > * + * {
  margin-top: 12px !important;
}
#themePanel {
  position:absolute;
  top:54px;
  right:0;
  width:125px;
  padding:7px;
  background:#222;
  border:1px solid #555;
  border-radius:10px;
  box-shadow:0 4px 12px #0005;
}

<body>
<div class="card">
<div id="themeControls" style="
  position:fixed;
  top:15px;
  right:15px;
  z-index:9999;
">
  <button type="button" id="showThemes" style="
    width:46px;
    height:46px;
    border-radius:50%;
    padding:0;
    background:#252536;
    color:white;
    border:1px solid #555;
    font-size:23px;
  ">🌙</button>

  <div id="themePanel" style="display:none">
    <button type="button" onclick="setTheme('dark')">🌙 Dark</button>
    <button type="button" onclick="setTheme('light')">☀️ Light</button>
  </div>
</div>
 
<div id="login">
  <h2>AAA Chat</h2>
  <p class="login-subtitle">Welcome Back</p>

  <div class="login-tabs">
    <button type="button" id="phoneTab" class="active">
      Phone Login
    </button>
    <button type="button" id="emailTab">
      Email Login
    </button>
  </div>

  
<div id="phoneLogin">

  <input id="phoneNumber" type="tel"
    placeholder="📱 ဖုန်းနံပါတ် (+95...)">

  <div id="recaptcha-container"></div>

  <button type="button" id="sendOtp">
    OTP ကုဒ်ပို့မယ်
  </button>

  <div id="otpSection" style="display:none">

    <input id="otpCode" type="text"
      inputmode="numeric"
      maxlength="6"
      placeholder="၆ လုံးပါ OTP ကုဒ်ထည့်ပါ">

    <p id="otpTimer">OTP ပြန်ပို့ရန် 60 စက္ကန့်</p>

    <button type="button" id="verifyOtp">
      အတည်ပြုမယ်
    </button>

    <button type="button" id="resendOtp" disabled>
      OTP ပြန်ပို့မယ်
    </button>

  </div>
</div>

  <div id="emailLogin" style="display:none">
    <input id="email" type="email"
      placeholder="✉️ Email">
    
<div class="password-row">
  <input id="password" type="password"
    placeholder="Password">
  <button type="button" id="togglePassword">👁️</button>
</div>

    
<input id="nickname" type="text"
  placeholder="Nickname (အကောင့်အသစ်အတွက်)">

<button id="signin">Login</button>
</div>

<button id="google" class="google">
  <span>G</span> Continue with Google
</button>

<div class="login-links">
  <button type="button" id="reset">Forgot Password?</button>
  <span>·</span>
  <button type="button" id="signup">Sign Up</button>
</div>

<p id="status"></p>
</div>


  <p id="status"></p>
</div>

<p id="status"></p>

 </div>
 <div id="chat">
  <h2>AAA Chat</h2>
  <p id="welcome"></p>
  <div id="messages" style="text-align:left;max-height:300px;overflow:auto"></div>
  <input id="message" placeholder="စာရေးပါ...">
  <button id="send">ပို့မယ်</button>
  <button id="logout">အကောင့်ထွက်မယ်</button>
  <p id="chatStatus"></p>
 </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import {
  getAuth,GoogleAuthProvider,signInWithRedirect,getRedirectResult,
 createUserWithEmailAndPassword,signInWithEmailAndPassword,
  onAuthStateChanged,signOut,sendPasswordResetEmail,
 RecaptchaVerifier,signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import {
 getFirestore,doc,setDoc,getDoc,collection,addDoc,
 query,orderBy,onSnapshot,serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyD86p4SjSiMlc3pVU_8JaN5uq0S0H0qn4Q",
 authDomain:"aaa-chat-1a5bc.firebaseapp.com",
 projectId:"aaa-chat-1a5bc",
 storageBucket:"aaa-chat-1a5bc.firebasestorage.app",
 messagingSenderId:"1036081337978",
 appId:"1:1036081337978:web:a33b6f006c5ab14baacdc3",
 measurementId:"G-373Q016V22"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const provider=new GoogleAuthProvider();

const $=id=>document.getElementById(id);

$("phoneTab").onclick = () => {
  $("phoneLogin").style.display = "block";
  $("emailLogin").style.display = "none";

  $("phoneTab").classList.add("active");
  $("emailTab").classList.remove("active");
};

$("emailTab").onclick = () => {
  $("phoneLogin").style.display = "none";
  $("emailLogin").style.display = "block";

  $("emailTab").classList.add("active");
  $("phoneTab").classList.remove("active");
};

$("showThemes").onclick = () => {
  const panel = $("themePanel");
  panel.style.display =
    panel.style.display === "none" ? "block" : "none";
};
$("togglePassword").onclick = () => {
  const password = $("password");
  const visible = password.type === "password";
  password.type = visible ? "text" : "password";
  $("togglePassword").textContent = visible ? "🙈" : "👁️";
};
$("reset").onclick = async () => {
  const email = $("email").value.trim();

  if (!email) {
    $("status").textContent = "အရင်ဆုံး Gmail ထည့်ပေးပါ။";
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    $("status").textContent =
      "Password ပြန်သတ်မှတ်ရန် Email ပို့ပြီးပါပြီ။ Gmail ကို စစ်ဆေးပါ။";
  } catch (error) {
    $("status").textContent =
      "Error: " + error.code;
  }
};
// PHONE OTP LOGIN
let confirmationResult = null;
let recaptchaVerifier = null;
let otpTimer = null;

function setupRecaptcha() {
  if (recaptchaVerifier) return recaptchaVerifier;

  recaptchaVerifier = new RecaptchaVerifier(
    auth,
    "recaptcha-container",
    {
      size: "normal",
      callback: () => {
        $("status").textContent = "အတည်ပြုမှု အောင်မြင်ပါပြီ။";
      },
      "expired-callback": () => {
        $("status").textContent =
          "reCAPTCHA သက်တမ်းကုန်သွားပါပြီ။ ပြန်စမ်းပါ။";
      }
    }
  );

  return recaptchaVerifier;
}

$("sendOtp").onclick = async () => {
  try {
    const phone = $("phoneNumber").value.trim();

    if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
      throw new Error("နိုင်ငံကုဒ်နဲ့ ဖုန်းနံပါတ်ထည့်ပါ။ ဥပမာ +959...");
    }

    $("sendOtp").disabled = true;

    const verifier = setupRecaptcha();

    confirmationResult =
      await signInWithPhoneNumber(auth, phone, verifier);

    $("otpSection").style.display = "block";
startOtpTimer();
    $("status").textContent = "OTP ကုဒ် ပို့ပြီးပါပြီ။ SMS ကို စစ်ဆေးပါ။";

  } catch (error) {
    $("status").textContent =
      "OTP Error: " + error.code + " / " + error.message;

    $("sendOtp").disabled = false;
  }
};

$("verifyOtp").onclick = async () => {
  try {
    if (!confirmationResult) {
      throw new Error("အရင်ဆုံး OTP ကုဒ်တောင်းပါ။");
    }

    const code = $("otpCode").value.trim();

    if (!/^\d{6}$/.test(code)) {
      throw new Error("OTP ၆ လုံး ထည့်ပါ။");
    }

    await confirmationResult.confirm(code);

    $("status").textContent = "Phone Login အောင်မြင်ပါပြီ။";

  } catch (error) {
    $("status").textContent =
      "OTP Error: " + error.code + " / " + error.message;
  }
};
// OTP RESEND TIMER
function startOtpTimer() {
  let seconds = 60;

  $("resendOtp").disabled = true;
  $("otpTimer").textContent = "OTP ပြန်ပို့ရန် " + seconds + " စက္ကန့်";

  clearInterval(otpTimer);

  otpTimer = setInterval(() => {
    seconds--;

    $("otpTimer").textContent =
      "OTP ပြန်ပို့ရန် " + seconds + " စက္ကန့်";

    if (seconds <= 0) {
      clearInterval(otpTimer);
      $("resendOtp").disabled = false;
      $("otpTimer").textContent = "OTP ပြန်ပို့နိုင်ပါပြီ။";
    }
  }, 1000);
}

$("resendOtp").onclick = async () => {
  try {
    $("resendOtp").disabled = true;

    if (recaptchaVerifier) {
      recaptchaVerifier.clear();
      recaptchaVerifier = null;
    }

    const phone = $("phoneNumber").value.trim();
    const verifier = setupRecaptcha();

    confirmationResult =
      await signInWithPhoneNumber(auth, phone, verifier);

    $("status").textContent = "OTP အသစ် ပို့ပြီးပါပြီ။";
    startOtpTimer();

  } catch (error) {
    $("status").textContent =
      "OTP Error: " + error.code + " / " + error.message;

    $("resendOtp").disabled = false;
  }
};
let currentUser=null;
let stopMessages=null;

$("signup").onclick=async()=>{
 try{
  const email=$("email").value.trim();
  const password=$("password").value;
  const nickname=$("nickname").value.trim();
  if(!nickname) throw Error("Nickname ထည့်ပါ");
  const result=await createUserWithEmailAndPassword(auth,email,password);
  await setDoc(doc(db,"users",result.user.uid),{
   nickname,createdAt:serverTimestamp()
  });
 }catch(e){$("status").textContent=e.message}
};

$("signin").onclick=async()=>{
 try{
  await signInWithEmailAndPassword(
   auth,$("email").value.trim(),$("password").value
  );
 }catch(e){$("status").textContent=e.message}
};

$("google").onclick=async()=>{
 try{
  await signInWithRedirect(auth,provider);
 }catch(e){$("status").textContent=e.message}
};

getRedirectResult(auth)
 .then(result=>{
  if(result && result.user){
   $("status").textContent =
    "Google Login Success: " + result.user.email;
  }
 })
 .catch(error=>{
  $("status").textContent =
   "Google Login Error: " + error.code + " / " + error.message;
 });

onAuthStateChanged(auth,async user=>{
 currentUser=user;


 if(!user){
  $("login").style.display="block";
  $("chat").style.display="none";
  if(stopMessages) stopMessages();
  return;
 }
 $("login").style.display="none";
 $("chat").style.display="block";
 let profile=await getDoc(doc(db,"users",user.uid));
 if(!profile.exists() && user.displayName){
  await setDoc(doc(db,"users",user.uid),{
   nickname:user.displayName,createdAt:serverTimestamp()
  });
  profile=await getDoc(doc(db,"users",user.uid));
 }
 $("welcome").textContent="မင်္ဂလာပါ "+(profile.data()?.nickname||"User");
 loadMessages();
});

function loadMessages(){
 if(stopMessages) stopMessages();
 const q=query(
  collection(db,"rooms","main","messages"),
  orderBy("createdAt")
 );
 stopMessages=onSnapshot(q,snapshot=>{
  $("messages").innerHTML="";
  snapshot.forEach(item=>{
   const data=item.data();
   const p=document.createElement("p");
   p.textContent=(data.nickname||"User")+": "+(data.text||"");
   $("messages").appendChild(p);
  });
  $("messages").scrollTop=$("messages").scrollHeight;
 },error=>{
  $("chatStatus").textContent=error.message;
 });
}

$("send").onclick=async()=>{
 try{
  const text=$("message").value.trim();
  if(!text)return;
  const profile=await getDoc(doc(db,"users",currentUser.uid));
  await addDoc(collection(db,"rooms","main","messages"),{
   uid:currentUser.uid,
   nickname:profile.data()?.nickname||"User",
   text,createdAt:serverTimestamp()
  });
  $("message").value="";
 }catch(e){$("chatStatus").textContent=e.message}
};

$("logout").onclick=()=>signOut(auth);
function setTheme(theme) {
  if (theme !== "light" && theme !== "dark") {
    theme = "dark";
  }

  document.body.classList.remove(
    "theme-dark",
    "theme-purple",
    "theme-pink",
    "theme-blue",
    "theme-light"
  );

  document.body.classList.add("theme-" + theme);
  localStorage.setItem("aaaChatTheme", theme);
}

document.querySelectorAll("[data-theme]").forEach(button => {
  button.onclick = () => setTheme(button.dataset.theme);
});

const savedTheme = localStorage.getItem("aaaChatTheme");
setTheme(savedTheme === "light" ? "light" : "dark"); localStorage.getItem("aaaChatTheme");
if (savedTheme) {
  setTheme(savedTheme);
}
</script>
</body>
</html>
