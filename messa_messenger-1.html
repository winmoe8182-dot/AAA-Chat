
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#635bff">
<title>AAA Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10121b;color:white;font-family:Arial,sans-serif}
header{background:#635bff;padding:18px;font-size:22px;font-weight:bold}
main{max-width:650px;margin:auto;padding:16px}
input,button{width:100%;padding:13px;margin:6px 0;border:0;border-radius:9px;font-size:15px}
input{background:#252838;color:white}
button{background:#635bff;color:white;font-weight:bold}
button:disabled{opacity:.5}
#chat{display:none}
#messages{height:48vh;overflow:auto;background:#1b1e2b;padding:12px;border-radius:12px}
.msg{background:#303449;padding:10px;margin:8px 0;border-radius:10px;overflow-wrap:anywhere}
.mine{background:#5149bd}
small{color:#ccc}
audio{width:100%;margin-top:8px}
#status{color:#b9b5ff}
</style>
</head>
<body>
<header> AAA Chat</header>
<main>
<section id="login">
<h3>အကောင့်ဝင်ရန် / အသစ်ဖွင့်ရန်</h3>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="signup">အကောင့်အသစ်ဖွင့်မယ်</button>
<button id="signin">အကောင့်ဝင်မယ်</button>
<p id="status"></p>
</section>

<section id="chat">
<p id="who"></p>
<button id="logout">အကောင့်ထွက်မယ်</button>
<div id="messages"></div>
<input id="message" placeholder="စာရေးပါ...">
<button id="send">စာပို့မယ်</button>
<button id="record"> အသံဖမ်းရန်</button>
<p id="recordStatus"></p>
</section>
</main>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
 getAuth, createUserWithEmailAndPassword,
 signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
 getFirestore, collection, addDoc, query,
 orderBy, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

import {
 getStorage, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

const firebaseConfig = {
 apiKey: "AIzaSyD86p4SjSiMlc3pVU_8JaN5uq0S0H0qn4Q",
 authDomain: "aaa-chat-1a5bc.firebaseapp.com",
 projectId: "aaa-chat-1a5bc",
 storageBucket: "aaa-chat-1a5bc.firebasestorage.app",
 messagingSenderId: "1036081337978",
 appId: "1:1036081337978:web:a33b6f006c5ab14baacdc3",
 measurementId: "G-373Q016V22"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const $ = id => document.getElementById(id);
let currentUser = null;
let stopMessages = null;
let recorder = null;
let audioChunks = [];

$("signup").onclick = async () => {
 try {
  await createUserWithEmailAndPassword(
   auth, $("email").value.trim(), $("password").value
  );
 } catch(e) { $("status").textContent = e.message; }
};

$("signin").onclick = async () => {
 try {
  await signInWithEmailAndPassword(
   auth, $("email").value.trim(), $("password").value
  );
 } catch(e) { $("status").textContent = e.message; }
};

$("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
 currentUser = user;
 $("login").style.display = user ? "none" : "block";
 $("chat").style.display = user ? "block" : "none";

 if (stopMessages) stopMessages();

 if (user) {
  $("who").textContent = "ဝင်ထားသောအကောင့်: " + user.email;
  const q = query(
   collection(db, "rooms", "main", "messages"),
   orderBy("createdAt", "asc")
  );

  stopMessages = onSnapshot(q, snapshot => {
   $("messages").replaceChildren();

   snapshot.forEach(doc => {
    const data = doc.data();
    const item = document.createElement("div");
    item.className = "msg" +
      (data.uid === user.uid ? " mine" : "");

    const name = document.createElement("small");
    name.textContent = data.email || "User";
    item.appendChild(name);

    if (data.text) {
     const p = document.createElement("p");
     p.textContent = data.text;
     item.appendChild(p);
    }

    if (data.audioUrl) {
     const audio = document.createElement("audio");
     audio.controls = true;
     audio.src = data.audioUrl;
     item.appendChild(audio);
    }

    $("messages").appendChild(item);
   });

   $("messages").scrollTop = $("messages").scrollHeight;
  }, error => {
   $("status").textContent = error.message;
  });
 }
});

async function saveMessage(data) {
 await addDoc(collection(db, "rooms", "main", "messages"), {
  ...data,
  uid: currentUser.uid,
  email: currentUser.email,
  createdAt: serverTimestamp()
 });
}

$("send").onclick = async () => {
 const text = $("message").value.trim();
 if (!text || !currentUser) return;

 $("send").disabled = true;
 try {
  await saveMessage({text});
  $("message").value = "";
 } catch(e) {
  alert(e.message);
 }
 $("send").disabled = false;
};

$("message").addEventListener("keydown", e => {
 if (e.key === "Enter") $("send").click();
});

$("record").onclick = async () => {
 if (!currentUser) return;

 if (!recorder || recorder.state === "inactive") {
  try {
   const stream = await navigator.mediaDevices.getUserMedia({
    audio: true
   });
   audioChunks = [];
   recorder = new MediaRecorder(stream);

   recorder.ondataavailable = e => {
    if (e.data.size) audioChunks.push(e.data);
   };

   recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    $("recordStatus").textContent = "အသံပို့နေပါတယ်...";

    try {
     const blob = new Blob(audioChunks, {
      type: recorder.mimeType || "audio/webm"
     });
     const fileRef = ref(
      storage,
      "voiceMessages/" + currentUser.uid + "/" +
      Date.now() + ".webm"
     );
     await uploadBytes(fileRef, blob);
     const url = await getDownloadURL(fileRef);
     await saveMessage({audioUrl:url});
     $("recordStatus").textContent = "အသံပို့ပြီးပါပြီ။";
    } catch(e) {
     $("recordStatus").textContent = e.message;
    }
   };

   recorder.start();
   $("record").textContent = " အသံဖမ်းခြင်းရပ်မယ်";
   $("recordStatus").textContent = "အသံဖမ်းနေပါတယ်...";
  } catch(e) {
   $("recordStatus").textContent =
    "Microphone ခွင့်ပြုချက်လိုအပ်ပါတယ်: " + e.message;
  }
 } else {
  recorder.stop();
  $("record").textContent = " အသံဖမ်းရန်";
 }
};
</script>
<!-- Emoji Picker -->
<div id="emojiPicker" style="display:none; padding:10px; background:#252538; border-radius:12px; flex-wrap:wrap; gap:8px;">
  <button type="button" onclick="addEmoji('😀')">😀</button>
  <button type="button" onclick="addEmoji('😂')">😂</button>
  <button type="button" onclick="addEmoji('🥰')">🥰</button>
  <button type="button" onclick="addEmoji('😍')">😍</button>
  <button type="button" onclick="addEmoji('😎')">😎</button>
  <button type="button" onclick="addEmoji('😭')">😭</button>
  <button type="button" onclick="addEmoji('❤️')">❤️</button>
  <button type="button" onclick="addEmoji('🔥')">🔥</button>
  <button type="button" onclick="addEmoji('🎉')">🎉</button>
  <button type="button" onclick="addEmoji('😘')">😘</button>
  <button type="button" onclick="addEmoji('👍')">👍</button>
  <button type="button" onclick="addEmoji('🥳')">🥳</button>
</div>
<script>
function addEmoji(emoji) {
  const input = document.querySelector('#message');
  if (!input) return;
  input.value += emoji;
  input.dispatchEvent(new Event('input', { bubbles: true }));
}
</script>
</body>
</html>
